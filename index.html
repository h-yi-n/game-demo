<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>口腔肌功能训练游戏</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <style>
      /* ============================================================
         以下仅服务「尚未做视觉」的页面，保持灰阶占位外观。
         已做视觉的页面不使用 .screen 这一层，因此不受影响。
         ============================================================ */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page-bg);
        color: var(--legacy-text);
        font-family: sans-serif;
        overflow: hidden;
      }

      .screen {
        width: 100%;
        height: 100%;
        overflow: auto;
        padding: 24px;
        background: var(--legacy-bg);
        color: var(--legacy-text);
        font-family: sans-serif;
      }

      .screen button {
        display: block;
        width: 100%;
        background: var(--legacy-box);
        color: var(--legacy-text);
        border: 2px solid var(--legacy-border);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .screen button:disabled {
        color: var(--legacy-border);
        cursor: not-allowed;
      }

      .screen .level-cleared {
        border-style: dashed;
        font-weight: bold;
      }

      .screen .level-locked {
        border-style: dotted;
      }

      .screen button:focus-visible {
        outline: 2px solid var(--legacy-border);
      }

      .overlay-card {
        width: 100%;
        background: var(--legacy-box);
        border: 2px solid var(--legacy-border);
      }

      ::selection {
        background: var(--legacy-box);
        color: var(--legacy-text);
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div id="screen-root" class="screen-root" aria-live="polite"></div>
      <div id="overlay-root" class="overlay-root"></div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/ui/icons.js"></script>
    <script src="js/screens/c1_splash.js"></script>
    <script src="js/screens/c2_home.js"></script>
    <script src="js/screens/c3_chapter.js"></script>
    <script src="js/screens/c4_play.js"></script>
    <script src="js/screens/c5_result.js"></script>
    <script src="js/screens/c6_level.js"></script>
    <script src="js/screens/c7_achievements.js"></script>
    <script src="js/screens/c8_skins.js"></script>
    <script src="js/screens/c9_collection.js"></script>
    <script src="js/screens/c10_settings.js"></script>
    <script src="js/screens/p1_overview.js"></script>
    <script src="js/screens/p2_plan.js"></script>
    <script src="js/screens/p3_records.js"></script>
    <script src="js/screens/l1_rest.js"></script>
    <script src="js/screens/l2_calibration.js"></script>
  </body>
</html>
